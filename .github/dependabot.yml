version: 2
updates:
  # Dart/Flutter packages (pubspec.yaml / pubspec.lock)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      flutter-minor-and-patch:
        update-types: ["minor", "patch"]

  # Android build: Gradle wrapper, AGP/Kotlin plugin versions and app dependencies
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # CI workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
