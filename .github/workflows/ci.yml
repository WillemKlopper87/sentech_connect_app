name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The snapshot must equal the platform's current contract. Skipped (with
      # a notice) when the secret is absent, e.g. on forks.
      - name: Check OpenAPI snapshot is current
        env:
          PLATFORM_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          PLATFORM_REF: ${{ vars.PLATFORM_REF || 'codex/naas-implementation' }}
        run: |
          if [ -z "$PLATFORM_TOKEN" ]; then
            echo "::notice::PLATFORM_REPO_TOKEN not set; OpenAPI drift check skipped"; exit 0
          fi
          git clone --depth 1 --branch "$PLATFORM_REF"             "https://x-access-token:${PLATFORM_TOKEN}@github.com/WillemKlopper87/sentech_connect_platform.git" ../platform
          dart run tool/sync_openapi.dart ../platform/apps/api/openapi.json
          git diff --exit-code -- test/contract/openapi.json || {
            echo "::error::test/contract/openapi.json is stale: run tool/sync_openapi.dart and commit"; exit 1; }

      # l10n output is committed; fail if the ARBs and generated Dart drift apart.
      - name: Check generated localisations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: Analyze (must report zero issues)
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      # Informational: newer versions blocked by constraints. Not a gate.
      - name: Outdated dependencies (informational)
        run: flutter pub outdated || true

  build-android-debug:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Debug-signed demo build: proves the Android toolchain (compileSdk 37,
      # JDK 17) still builds. Release signing stays an owner input (B17).
      - name: Build debug APK (demo flavour)
        run: flutter build apk --debug --dart-define=APP_FLAVOR=demo
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
