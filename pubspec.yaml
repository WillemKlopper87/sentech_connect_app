name: sentech_connect_app
description: "Sentech Connect — 5G FWA subscriber app (UI + mock-repository phase)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^3.0.0

  # Navigation
  go_router: ^18.0.2

  # Functional error handling (Either<Failure, T>)
  fpdart: ^1.1.1

  # Dependency injection (manual registration, no codegen in this phase)
  get_it: ^9.3.0

  # Real device integrations
  mobile_scanner: ^7.4.2
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  webview_flutter: ^4.14.1
  video_player: ^2.14.0
  image_picker: ^1.2.4
  image: ^4.12.0

dev_dependencies:
  # Parse customer-copy expressions in the localization guard (test only).
  analyzer: ^13.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true # gen-l10n (see l10n.yaml)

  assets:
    - assets/brand/logo/sentech_logo_full_colour.jpg
    - assets/brand/logo/sentech_logo_white.png
    - assets/brand/boot/sentech_boot.mp4

flutter_launcher_icons:
  android: true
  image_path: "assets/brand/logo/sentech_icon_square.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/logo/sentech_icon_square.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/logo/sentech_icon_square.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/logo/sentech_icon_square.png
